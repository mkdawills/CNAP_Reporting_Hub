[project]
name = "cnap-platform"
version = "0.1.0"
description = "CNAP Evaluation and Reporting Platform (Kansas State University, CNAP Center)"
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.18",
    "psycopg[binary]==3.3.6",
    "django-environ==0.12.0",
    "openpyxl==3.1.5",
    "gunicorn==23.0.0",
    "whitenoise==6.11.0",
    "reportlab==5.0.1",
    "pypdf==6.17.0",
    "python-docx==1.2.0",
    "Pillow==12.3.0",  # SitePhoto uses an ImageField
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-django==4.11.1",
    "factory-boy==3.3.3",
    "ruff==0.16.9",
]

# The Hub is a Django project, not a library: nothing to package. An editable install only pulls in the
# dependencies (CI runs pip install -e ".[dev]").
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --reuse-db"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
# DJ001: nullable CharFields are deliberate where NULL carries meaning for a
# composite foreign key or a CHECK (project_kind, scale_kind, substatus, from_status).
# DJ008: join tables need no __str__.
# B905: zip() without strict= keeps today's behavior (stops at the shorter list); strict= could raise mid-page.
# B023: each closure is called inside the same loop iteration that defines it, so it sees the right value.
# E731: short lambdas assigned to a name are kept as written.
ignore = ["E501", "DJ001", "DJ008", "B905", "B023", "E731"]

[tool.ruff.lint.per-file-ignores]
# Tests import a pytest fixture and then take it as a parameter (F811), and use l for a link in short loops (E741).
"tests/*" = ["F811", "E741"]
