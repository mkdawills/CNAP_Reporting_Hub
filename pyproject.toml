[project]
name = "cnap-platform"
version = "0.1.0"
description = "CNAP Evaluation and Reporting Platform (Kansas State University, CNAP Center)"
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.18",
    "psycopg[binary]==3.3.6",
    "django-environ==0.12.0",
    "openpyxl==3.1.5",
    "gunicorn==23.0.0",
    "whitenoise==6.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-django==4.11.1",
    "factory-boy==3.3.3",
    "ruff==0.14.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --reuse-db"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
# DJ001: nullable CharFields are deliberate where NULL carries meaning for a
# composite foreign key or a CHECK (project_kind, scale_kind, substatus, from_status).
# DJ008: join tables need no __str__.
ignore = ["E501", "DJ001", "DJ008"]
