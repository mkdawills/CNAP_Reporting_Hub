# GitHub Codespaces test copy (MW 2026-11-08). Fictional data only. Not for production.
# Modeled on GitHub's own "Python 3 & PostgreSQL" dev container template.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/cnap-platform:cached
    # Share the database container's network, so GitHub's port forwarding reaches the site.
    network_mode: service:db
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: codespaces-test-only-not-a-real-secret
      DEBUG: "true"
      DATABASE_URL: postgres://cnap:cnap@localhost:5432/cnap
      ALLOWED_HOSTS: .app.github.dev,localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://*.app.github.dev
      SITE_URL: http://localhost:8000
      # Inside the workspace, so the codespace user can always write to it (ignored by git).
      MEDIA_ROOT: /workspaces/cnap-platform/media
      UI_PROTOTYPE: "true"
      SSO_ENABLED: "false"
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cnap
      POSTGRES_USER: cnap
      POSTGRES_PASSWORD: cnap
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
