# GitHub Codespaces test copy (MW 2026-11-08). Fictional data only. Not for production.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/cnap-platform:cached
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: codespaces-test-only-not-a-real-secret
      DEBUG: "true"
      DATABASE_URL: postgres://cnap:cnap@db:5432/cnap
      ALLOWED_HOSTS: .app.github.dev,localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://*.app.github.dev
      SITE_URL: http://localhost:8000
      MEDIA_ROOT: /tmp/media
      UI_PROTOTYPE: "true"
      SSO_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cnap
      POSTGRES_USER: cnap
      POSTGRES_PASSWORD: cnap
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnap -d cnap"]
      interval: 5s
      timeout: 3s
      retries: 10
