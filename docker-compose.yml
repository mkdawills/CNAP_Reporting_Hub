# One command brings up the whole platform: docker compose up -d
# Two services, two persistent volumes. Nothing else.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cnap
      POSTGRES_USER: cnap
      POSTGRES_PASSWORD: cnap          # change in production via .env and this file
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnap -d cnap"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media:/data/media
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

volumes:
  pgdata:
  media:
