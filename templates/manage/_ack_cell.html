<td class="small ack-td"><span class="ack-l {% if ack is None %}ack-q{% elif ack %}ack-y{% else %}ack-n{% endif %}">{% if ack is None %}Not checked{% elif ack %}Yes{% else %}No{% endif %}</span>{% if can_edit %}<form method="post" action="{% url 'manage:set_ack' kind o.pk %}" class="ack-f" title="Records the answer without opening the full record.">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% if ack is None %}<button class="btn small ghost" name="value" value="yes">Yes</button><button class="btn small ghost" name="value" value="no">No</button>{% elif ack %}<button class="btn small ghost" name="value" value="no">Change to No</button>{% else %}<button class="btn small ghost" name="value" value="yes">Change to Yes</button>{% endif %}</form>{% endif %}</td>
