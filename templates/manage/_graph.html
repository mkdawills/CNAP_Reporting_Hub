{% if g.svg %}<div class="graphwrap">
  <div class="gmain">{{ g.svg }}</div>
  {% if g.note %}<p class="small muted">{{ g.note }}</p>{% endif %}
  {% if g.alt %}<div class="galt" hidden>{{ g.alt }}</div>
  <p class="small gflip"><button type="button" class="fchipbtn flipbtn" title="Redraws the graph above with its groupings swapped, so you can see the same numbers from the other direction. Click again to turn it back.">Flip the graph’s axes</button></p>{% endif %}
</div>{% endif %}
