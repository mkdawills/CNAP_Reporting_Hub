{# The heading over items from one newsletter issue (MW 2026-11-10), such as K-State Research Weekly. #}
<div class="fv-issue"><h3 class="px-h3">From {{ b.name }}</h3><p class="px-note">The issue of {{ b.issue_date|date:"F j, Y" }}.{% if b.url %} <a class="px-link" href="{{ b.url }}" target="_blank" rel="noopener" title="Opens the full issue in a new tab.">Read the full issue</a>{% endif %}</p></div>
