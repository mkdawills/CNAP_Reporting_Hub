{% load cnap %}{# The "As of" control (MW 2026-11-05). Needs: day (or None), picks, and optionally owner and owners for "Entering for". #}
<form method="get" class="r33-asof">{% if owners|length > 1 %}<input type="hidden" name="for" value="{{ owner.pk }}">{% endif %}
  <label class="px-label" for="asof-d">As of {% info "Choose a past day to see where each paper, proposal, and talk stood at the end of that day. The quick picks are the last days of past reporting sessions. Days before the Hub’s records show only what was imported." %}</label>
  <input id="asof-d" type="date" name="asof" value="{% if day %}{{ day|date:'Y-m-d' }}{% endif %}" max="{% now 'Y-m-d' %}">
  {% if picks %}<select aria-label="Last day of a past reporting session" onchange="if(this.value){document.getElementById('asof-d').value=this.value;this.form.submit()}"><option value="">Last day of a reporting session</option>{% for q in picks %}<option value="{{ q.day|date:'Y-m-d' }}">{{ q.label }}, {{ q.day|date:"F j, Y" }}</option>{% endfor %}</select>{% endif %}
  <button class="px-btn small" type="submit">Show</button>{% if day %}<a class="px-link" href="{% url 'portal:outcomes' %}{% if owners|length > 1 %}?for={{ owner.pk }}{% endif %}">Back to today</a>{% endif %}
</form>
