name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: cnap, POSTGRES_PASSWORD: cnap, POSTGRES_DB: cnap }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cnap" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SECRET_KEY: ci-secret-key
      DATABASE_URL: postgres://cnap:cnap@localhost:5432/cnap
      DJANGO_SETTINGS_MODULE: config.settings.test
      MEDIA_ROOT: /tmp/media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest --create-db
