# A public test copy of the CNAP Reporting Hub on Render, outside K-State (MW 2026-11-09).
# Fictional data only. Not for real CNAP data. Uses Render's free plan: the site sleeps after
# 15 minutes without visitors and wakes in about a minute; the free database lasts 30 days.
services:
  - type: web
    name: cnap-hub-test
    runtime: docker
    plan: free
    dockerCommand: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed --fictional &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.demo
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cnap-hub-test-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: SITE_URL
        value: https://cnap-hub-test.onrender.com
      - key: UI_PROTOTYPE
        value: "true"
      - key: SSO_ENABLED
        value: "false"
      - key: MEDIA_ROOT
        value: /tmp/media
databases:
  - name: cnap-hub-test-db
    plan: free
    databaseName: cnap
    user: cnap
